[project]
name = "verdict-demo"
version = "0.1.0"
description = "A small fictional support agent, evaluated in CI with Verdict."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
# verdict-eval with the current-models fix (dannicolau7/verdict#15). Until that is
# released, install it from GitHub: pip install "git+https://github.com/dannicolau7/verdict@main"
eval = ["verdict-eval>=0.9"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["support_agent"]
py-modules = ["verdict_adapter"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
