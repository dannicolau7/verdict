name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # verdict-eval from GitHub until the current-models fix is on PyPI (see pyproject.toml).
      - run: pip install -e ".[dev]" "git+https://github.com/dannicolau7/verdict@main"
      - run: pytest   # offline: a scripted fake client, no API key
