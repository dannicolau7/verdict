# Did this change make the agent worse? Runs on PRs that touch the agent.
# Needs the repository secret ANTHROPIC_API_KEY. Each run calls the API many times
# (cases x runs x 2 sides, plus a judge call per response): watch your spend.
# This will move to dannicolau7/verdict-action once it ships, which also posts a PR comment.
name: Verdict

on:
  pull_request:
    paths: ["prompts/**", "tools/**", "support_agent/**", "verdict_adapter.py", "verdict.yaml", "evals/**"]

permissions:
  contents: read

concurrency:
  group: verdict-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEFAULT_TIMEOUT_SECONDS: "180"   # an agent run makes several model calls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verdict diff checks out the base commit too
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . "git+https://github.com/dannicolau7/verdict@main"
      - name: verdict diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          verdict diff --base "$BASE" --head "$HEAD" --md-out verdict-diff.md --json-out verdict-diff.json
          code=$?
          [ -f verdict-diff.md ] && cat verdict-diff.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

  calibrate:
    # Runs its steps only when the labels or verdict.yaml changed (checked below).
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip unless labels or config changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(evals/human_labels.jsonl|verdict.yaml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.changed.outputs.run == 'true'
        run: pip install "git+https://github.com/dannicolau7/verdict@main"
      - if: steps.changed.outputs.run == 'true'
        run: |
          set +e
          verdict calibrate
          code=$?
          [ -f verdict-calibrate.md ] && cat verdict-calibrate.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
