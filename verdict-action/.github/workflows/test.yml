name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck run.sh

  skip-path:
    # Runs the action end to end with no watched changes: installs verdict-eval,
    # runs `verdict diff`, and checks the outputs. No API key needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: verdict
        uses: ./
        with:
          config: tests/fixture/verdict.yaml
          base: ${{ github.sha }}
          head: ${{ github.sha }}
          comment: "false"
      - name: Check outputs
        env:
          STATUS: ${{ steps.verdict.outputs.status }}
          PASSED: ${{ steps.verdict.outputs.passed }}
          JSON: ${{ steps.verdict.outputs.json-path }}
        run: |
          test "$STATUS" = skipped
          test "$PASSED" = true
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "skipped"' "$JSON"
